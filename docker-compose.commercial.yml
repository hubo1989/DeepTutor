# Commercial Foundation overlay.
#
# Usage:
#   docker compose --env-file commercial.env \
#     -f docker-compose.yml -f docker-compose.commercial.yml up -d
#
# The two secret files are deliberately not generated by Compose:
#   secrets/commercial_postgres_password
#   secrets/commercial_database_url
# The URL must address the service name below, for example:
#   postgresql://deeptutor:<url-encoded-password>@commercial-postgres:5432/deeptutor

services:
  commercial-postgres:
    image: postgres:15-bookworm
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: deeptutor
      POSTGRES_DB: deeptutor
      POSTGRES_PASSWORD_FILE: /run/secrets/commercial_postgres_password
    secrets:
      - commercial_postgres_password
    volumes:
      - commercial-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptutor -d deeptutor"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - deeptutor-network

  deeptutor:
    environment:
      DEEPTUTOR_COMMERCIAL_ENABLED: "true"
      DEEPTUTOR_COMMERCIAL_DATABASE_URL_FILE: /run/secrets/commercial_database_url
      DEEPTUTOR_COMMERCIAL_TRIAL_DAYS: "7"
      DEEPTUTOR_COMMERCIAL_TRIAL_LLM_MODELS: ${DEEPTUTOR_COMMERCIAL_TRIAL_LLM_MODELS:?set Trial v1 model binding}
      DEEPTUTOR_BOOTSTRAP_ADMIN_EMAIL: ${DEEPTUTOR_BOOTSTRAP_ADMIN_EMAIL:?set bootstrap admin email}
    secrets:
      - commercial_database_url
    depends_on:
      commercial-postgres:
        condition: service_healthy

secrets:
  commercial_postgres_password:
    file: ./secrets/commercial_postgres_password
  commercial_database_url:
    file: ./secrets/commercial_database_url

volumes:
  commercial-postgres-data:
