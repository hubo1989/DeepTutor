name: Docker Release

# Triggered when a GitHub Release is published, or manually via workflow_dispatch.
# Builds a multi-platform Docker image and pushes it to GitHub Container Registry (GHCR).
#
# Image: ghcr.io/${{ github.repository_owner }}/deeptutor
# Tags:
#   - Version tag stripped of 'v' prefix (e.g. release v1.2.3 → image tag 1.2.3)
#   - latest (always points to the most recently published release)
#
# Note: GitHub does not fire the `release` event for releases that are created
# or modified through the REST API. workflow_dispatch is the fallback for those
# cases — pass `version` (e.g. 1.6.0) to tag the image explicitly.
#
# Platforms: linux/amd64, linux/arm64

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag/branch/SHA); defaults to the workflow ref.'
        required: false
        default: ''
      version:
        description: 'Extra image tag (e.g. 1.6.0). Empty = release semver / latest only.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Multi-Platform Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # On manual dispatch, build the requested ref; otherwise the tag/branch that triggered the run.
          ref: ${{ inputs.ref || github.ref }}

      # Required for linux/arm64 cross-compilation on GitHub-hosted ubuntu runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Enable BuildKit with multi-platform build support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Prefer a PAT with packages scopes: the existing user-owned package
      # ghcr.io/hubo1989/deeptutor was created by a manual docker push and is
      # not linked to this repository, so GITHUB_TOKEN gets 403 on push until
      # Actions access is granted in the package settings.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      # Extract tags from the release:
      #   type=semver strips the leading 'v' (v1.2.3 → 1.2.3) — active on release events
      #   type=raw adds a 'latest' tag on every published release
      #   On manual dispatch, type=raw,value=<version> tags the image with the supplied version.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/deeptutor
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up repeated builds
          # mode=max caches all intermediate layers (frontend-builder and python-base are expensive)
          cache-from: type=gha
          cache-to: type=gha,mode=max
