# 三段式提示中文文案
# Stage 0: 鼓励（再想想）
# Stage 1: 提示（结构性提示）
# Stage 2: 讲解（完整解析）

encourage:
  - "再想想哦！💪 我相信你可以的！"
  - "差一点点啦！换个角度试试？🌟"
  - "没关系，我们再来一次！😊"
  - "别灰心，每个小探险家都会遇到挑战！🚀"

hint_generic:
  single_choice: "提示：仔细看看每个选项，排除掉明显不对的。🔍"
  image_choice: "提示：观察图片的特点，找到最匹配的答案。🔍"
  true_false: "提示：回到原文找找线索吧！🔍"
  fill_blank: "提示：答案就在文章里，注意关键词哦！🔍"
  matching: "提示：先找你最有把握的配对！🔍"
  ordering: "提示：想想事情发生的先后顺序。🔍"
  error_correction: "提示：逐个检查，找出不对的那个。🔍"
  boss_comprehensive: "提示：这是一道大题，逐个小问来解决！🔍"

explanation_default: "这道题的正确答案已经在阅读材料中提到啦，再仔细看看吧！📖"
